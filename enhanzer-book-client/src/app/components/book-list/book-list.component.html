<div class="container">
  <h2>Book List</h2>

  <div class="actions">
    <button class="btn btn-primary" routerLink="/books/new" style="margin-right: 10px;">Add New Book</button>
    <button class="btn btn-secondary" (click)="loadBooks()">Refresh List</button>
  </div>

  <table class="book-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>ISBN</th>
        <th>Publication Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let book of books">
        <td>{{ book.id }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.isbn }}</td>
        <td>{{ book.publicationDate | date:'mediumDate' }}</td>
        <td class="action-buttons">
          <button class="btn btn-warning btn-sm" [routerLink]="['/books/edit', book.id]">Edit</button>
          <button class="btn btn-danger btn-sm" (click)="deleteBook(book.id)">Delete</button>
        </td>
      </tr>
      <tr *ngIf="books.length === 0">
        <td colspan="6" class="text-center">No books found.</td>
      </tr>
    </tbody>
  </table>
</div>
